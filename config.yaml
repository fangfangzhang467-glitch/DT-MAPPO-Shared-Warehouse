project:
  name: DT-MAPPO-Shared-Warehouse
  description: Reproducible digital-twin-enabled multi-agent storage-location optimization for shared warehouses.
  seed_set: [11, 23, 37, 51, 79]
  device: auto

warehouse:
  floor_area_m2: 18000
  zones: 12
  aisles: 48
  storage_locations: 9600
  rack_levels_min: 4
  rack_levels_max: 6
  tenants: 6
  average_inventory_units: 420000
  operational_days: 180
  decision_interval_seconds: 300
  twin_resolution_seconds: 1
  aisle_capacity: 24
  relocation_enabled: true
  max_candidate_locations: 32

# Values below are reproducibility defaults where the manuscript does not provide exact numeric settings.
# They are deliberately centralized here so they can be changed without modifying source code.
demand:
  process: nonstationary_poisson
  base_orders_per_hour: [18, 27, 42, 31, 38, 14]
  volatility: [0.10, 0.25, 0.45, 0.25, 0.45, 0.10]
  daily_period_amplitude: 0.30
  weekly_period_amplitude: 0.10
  burst_probability: 0.02
  burst_multiplier: 2.5

congestion:
  sensitivity_beta: 1.7
  spillover: 0.15
  decay: 0.90
  noise_std: 0.015
  max_normalized_congestion: 1.0

reward:
  retrieval_weight: 1.0
  congestion_weight: 0.55
  fairness_weight: 0.35
  invalid_action_penalty: 2.0
  throughput_bonus: 0.10

mappo:
  hidden_sizes: [256, 128, 64]
  activation: relu
  learning_rate: 0.0003
  gamma: 0.95
  gae_lambda: 0.95
  clip_ratio: 0.20
  entropy_coef: 0.01
  value_coef: 0.50
  max_grad_norm: 0.50
  update_epochs: 8
  minibatch_size: 256
  rollout_steps: 512
  normalize_advantage: true
  value_clip: true

single_agent_ppo:
  hidden_sizes: [256, 128, 64]
  learning_rate: 0.0003
  gamma: 0.95
  gae_lambda: 0.95
  clip_ratio: 0.20
  entropy_coef: 0.01
  value_coef: 0.50
  update_epochs: 8
  rollout_steps: 512

qmix:
  agent_hidden: 128
  mixer_hidden: 64
  learning_rate: 0.0005
  gamma: 0.95
  replay_capacity: 100000
  batch_size: 64
  target_update_steps: 500
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 60000

training:
  episodes: 1200
  max_steps_per_episode: 288
  evaluation_episodes: 40
  checkpoint_interval: 100

experiments:
  normal:
    demand_multiplier: 1.0
    blocked_aisle_fraction: 0.0
    observation_delay_steps: 0
    sensor_noise_std: 0.0
  demand_shock:
    demand_multiplier: 1.75
    blocked_aisle_fraction: 0.0
    observation_delay_steps: 0
    sensor_noise_std: 0.0
  severe_demand_shock:
    demand_multiplier: 2.25
    blocked_aisle_fraction: 0.0
    observation_delay_steps: 0
    sensor_noise_std: 0.0
  layout_perturbation:
    demand_multiplier: 1.0
    blocked_aisle_fraction: 0.15
    observation_delay_steps: 0
    sensor_noise_std: 0.0
  delayed_twin:
    demand_multiplier: 1.0
    blocked_aisle_fraction: 0.0
    observation_delay_steps: 2
    sensor_noise_std: 0.03

ablation:
  full_model:
    dynamic_twin: true
    multi_agent: true
    fairness_reward: true
  without_dynamic_twin:
    dynamic_twin: false
    multi_agent: true
    fairness_reward: true
  without_marl:
    dynamic_twin: true
    multi_agent: false
    fairness_reward: true
  without_fairness_reward:
    dynamic_twin: true
    multi_agent: true
    fairness_reward: false

statistics:
  confidence_level: 0.95
  alpha: 0.05
  multiple_comparison: holm
  paired_tests: true
